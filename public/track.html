<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل — تتبع طلبك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>📍</text></svg>">
</head>
<body>
  <div id="topbar"></div>
  <main class="container">
    <div class="track-card">
      <div class="section-head" style="margin-bottom:22px">
        <span class="kicker">تتبع الطلبات</span>
        <h2>فين طلبك؟</h2>
        <p>اكتب كود الطلب اللي ظهر لك بعد ما طلبت، وشوف حالة طلبك خطوة بخطوة</p>
      </div>
      <form id="trackForm" class="flex" style="gap:10px">
        <input id="codeInput" class="field" style="flex:1;margin:0" maxlength="12" placeholder="7K2M-9QX4" required dir="ltr">
        <button class="btn btn-gold" id="trackBtn" type="submit"></button>
      </form>
      <div id="results" class="mt-3"></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
